name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-checks:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Test release packaging
        run: bash Tests/Scripts/package-release-tests.sh

      - name: Run Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Compile release app
        run: swift build -c release --product FluxLLMApp

  python-tests:
    name: Python tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run mock server tests
        run: python3 -m unittest discover -s scripts -p 'test_mock*.py' -v
